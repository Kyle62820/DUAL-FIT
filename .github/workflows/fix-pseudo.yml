name: Fix profile username

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch saveUsername
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """async function saveUsername(){if(!currentUser)return toast('Connecte-toi d’abord');const username=$('username').value.trim();if(!username)return authStatus('Entre un pseudo.');try{await rest('profiles?id=eq.'+encodeURIComponent(currentUser.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({username})});$('userBtn').textContent='👤 '+username;$('account').textContent='Connecté en tant que '+username;authStatus('Pseudo enregistré.',true);toast('Pseudo enregistré');await refresh()}catch(e){authStatus('Impossible d’enregistrer le pseudo : '+(e.message||String(e)))}}"""
          new = """async function saveUsername(){if(!currentUser)return toast('Connecte-toi d’abord');const username=$('username').value.trim();if(!username)return authStatus('Entre un pseudo.');try{const updated=await rest('profiles?id=eq.'+encodeURIComponent(currentUser.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({username})});if(!updated.length||updated[0].username!==username)throw Error('Le pseudo n’a pas été enregistré dans Supabase.');$('userBtn').textContent='👤 '+username;$('account').textContent='Connecté en tant que '+username;authStatus('Pseudo enregistré.',true);toast('Pseudo enregistré');await loadProfile()}catch(e){authStatus('Impossible d’enregistrer le pseudo : '+(e.message||String(e)));toast('Échec de l’enregistrement')}}"""
          if old not in s:
              raise SystemExit('saveUsername function not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: make username update verifiable"
          git push
